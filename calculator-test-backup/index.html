<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="calculator" role="application" aria-label="Calculator">
    <div class="display" id="display" aria-live="polite" aria-atomic="true">
      <span id="expression"></span>
      <span id="result">0</span>
    </div>

    <div class="buttons" role="group" aria-label="Calculator buttons">
      <!-- Row 1 -->
      <button class="btn btn-clear" data-action="clear" aria-label="Clear all">AC</button>
      <button class="btn btn-backspace" data-action="backspace" aria-label="Backspace">⌫</button>
      <button class="btn btn-op" data-action="op" data-value="/" aria-label="Divide">÷</button>
      <button class="btn btn-op" data-action="op" data-value="*" aria-label="Multiply">×</button>

      <!-- Row 2 -->
      <button class="btn btn-num" data-action="num" data-value="7">7</button>
      <button class="btn btn-num" data-action="num" data-value="8">8</button>
      <button class="btn btn-num" data-action="num" data-value="9">9</button>
      <button class="btn btn-op" data-action="op" data-value="-" aria-label="Subtract">−</button>

      <!-- Row 3 -->
      <button class="btn btn-num" data-action="num" data-value="4">4</button>
      <button class="btn btn-num" data-action="num" data-value="5">5</button>
      <button class="btn btn-num" data-action="num" data-value="6">6</button>
      <button class="btn btn-op" data-action="op" data-value="+" aria-label="Add">+</button>

      <!-- Row 4 -->
      <button class="btn btn-num" data-action="num" data-value="1">1</button>
      <button class="btn btn-num" data-action="num" data-value="2">2</button>
      <button class="btn btn-num" data-action="num" data-value="3">3</button>
      <button class="btn btn-equals" data-action="equals" aria-label="Equals">=</button>

      <!-- Row 5 -->
      <button class="btn btn-num" data-action="negate" aria-label="Negate">±</button>
      <button class="btn btn-num" data-action="num" data-value="0">0</button>
      <button class="btn btn-num" data-action="decimal" aria-label="Decimal point">.</button>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
