<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A self-contained, accessible vanilla JavaScript calculator." />
  <title>Calculator</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="calculator">
    <h1 class="calculator__title">Calculator</h1>

    <section class="calculator__display-panel" aria-label="Display">
      <p class="calculator__expression" id="expression" aria-hidden="true"></p>
      <output
        class="calculator__display"
        id="display"
        role="status"
        aria-live="polite"
        aria-label="Result"
      >0</output>
    </section>

    <section class="calculator__keys" id="keys" aria-label="Keypad">
      <div class="calculator__grid">
        <button type="button" class="key key--utility" data-action="clear" aria-label="Clear all">AC</button>
        <button type="button" class="key key--utility" data-action="negate" aria-label="Toggle sign">±</button>
        <button type="button" class="key key--utility" data-action="backspace" aria-label="Backspace">⌫</button>
        <button type="button" class="key key--operator" data-action="operator" data-operator="/" aria-label="Divide">÷</button>

        <button type="button" class="key" data-digit="7" aria-label="Seven">7</button>
        <button type="button" class="key" data-digit="8" aria-label="Eight">8</button>
        <button type="button" class="key" data-digit="9" aria-label="Nine">9</button>
        <button type="button" class="key key--operator" data-action="operator" data-operator="*" aria-label="Multiply">×</button>

        <button type="button" class="key" data-digit="4" aria-label="Four">4</button>
        <button type="button" class="key" data-digit="5" aria-label="Five">5</button>
        <button type="button" class="key" data-digit="6" aria-label="Six">6</button>
        <button type="button" class="key key--operator" data-action="operator" data-operator="-" aria-label="Subtract">−</button>

        <button type="button" class="key" data-digit="1" aria-label="One">1</button>
        <button type="button" class="key" data-digit="2" aria-label="Two">2</button>
        <button type="button" class="key" data-digit="3" aria-label="Three">3</button>
        <button type="button" class="key key--operator" data-action="operator" data-operator="+" aria-label="Add">+</button>

        <button type="button" class="key key--zero" data-digit="0" aria-label="Zero">0</button>
        <button type="button" class="key" data-action="decimal" aria-label="Decimal point">.</button>
        <button type="button" class="key key--equals" data-action="equals" aria-label="Equals">=</button>
      </div>
    </section>

    <p class="calculator__hint" id="hint">
      Keyboard: digits, <kbd>.</kbd>, <kbd>+</kbd>, <kbd>-</kbd>, <kbd>*</kbd>, <kbd>/</kbd>,
      <kbd>Enter</kbd> = equals, <kbd>Esc</kbd> = clear, <kbd>Backspace</kbd> = delete.
    </p>

    <noscript>
      <p class="calculator__noscript">This calculator requires JavaScript to be enabled.</p>
    </noscript>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
